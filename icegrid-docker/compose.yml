services:
  registry:
    container_name: registry
    image: zeroc/icegridregistry:3.7
    hostname: registry
    networks:
      icegrid:
        ipv4_address: 172.28.0.10
    volumes:
      - "./registry.config:/etc/icegridregistry.conf:ro"
    healthcheck:
      test: "bash -c 'echo > /dev/tcp/172.28.0.10/4061'"
      interval: 1s

  node1:
    container_name: node1
    build: docker/ignode
    image: ignode
    hostname: node1
    depends_on:
      registry:
        condition: service_healthy
    networks:
      icegrid:
        ipv4_address: 172.28.0.11
    volumes:
      - "./node1.config:/etc/icegridnode.conf:ro"
      - "../py/dist:/app:ro"

  node2:
    container_name: node2
    image: ignode
    hostname: node1
    depends_on:
      registry:
        condition: service_healthy
    networks:
      icegrid:
        ipv4_address: 172.28.0.12
    volumes:
      - "./node2.config:/etc/icegridnode.conf:ro"
      - "../py/dist:/app:ro"

networks:
  icegrid:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
