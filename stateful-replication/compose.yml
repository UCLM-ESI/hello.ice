services:

  ## - application plane -

  registry:
    image: zeroc/icegridregistry:3.7
    container_name: registry
    hostname: registry
    networks:
      icegrid:
        ipv4_address: 172.28.0.10
    volumes:
      - "./registry.config:/etc/icegridregistry.conf:ro"
    healthcheck:
      test: "bash -c ':> /dev/tcp/127.0.0.1/4061'"
      interval: 1s

  node1:
    build: docker/ignode-redis
    image: ignode-redis
    container_name: node1
    hostname: node1
    depends_on:
      registry:
        condition: service_healthy
      sentinel:
        condition: service_started
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    networks: [icegrid]
    volumes:
      - "./node1.config:/etc/icegridnode.conf:ro"
      - "./counter:/app"

  node2:
    image: ignode-redis
    container_name: node2
    hostname: node2
    depends_on:
      registry:
        condition: service_healthy
      sentinel:
        condition: service_started
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    networks: [icegrid]
    volumes:
      - "./node2.config:/etc/icegridnode.conf:ro"
      - "./counter:/app"

  ## - Redis data plane -

  redis-master:
    image: redis:7
    container_name: redis-master
    hostname: redis-master
    command: redis-server --appendonly yes --repl-diskless-load on-empty-db --replica-announce-ip redis-master --replica-announce-port 6379 --protected-mode no
    networks:
      icegrid:
        ipv4_address: 172.28.0.20
    volumes:
      - redis-master-data:/data

  redis-replica-1:
    build: docker/redis-replica
    image: redis-replica
    container_name: redis-replica-1
    hostname: redis-replica-1
    depends_on:
      - sentinel
    networks: [icegrid]
    environment:
      SENTINEL_HOST: sentinel-1
      SENTINEL_PORT: 26379

  redis-replica-2:
    build: docker/redis-replica
    image: redis-replica
    container_name: redis-replica-2
    hostname: redis-replica-2
    depends_on:
      - sentinel
    networks: [icegrid]
    environment:
      SENTINEL_HOST: sentinel-2
      SENTINEL_PORT: 26379

  ## - Redis control plane -

  sentinel: &sentinel-base
    build: docker/sentinel
    image: redis-sentinel
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_started
    networks: [icegrid]

  sentinel-1:
    <<: *sentinel-base
    container_name: sentinel-1
    hostname: sentinel-1

  sentinel-2:
    <<: *sentinel-base
    container_name: sentinel-2
    hostname: sentinel-2

  sentinel-3:
    <<: *sentinel-base
    container_name: sentinel-3
    hostname: sentinel-3

networks:
  icegrid:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  redis-master-data:
