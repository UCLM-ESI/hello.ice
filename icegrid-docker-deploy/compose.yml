x-node: &node
  build: ../docker/ignode
  image: hello-ice/ignode
  pull_policy: never
  depends_on:
    registry:
      condition: service_healthy
  ulimits:
    nofile:
      soft: 1024
      hard: 1024

services:
  registry:
    image: zeroc/icegridregistry:3.7
    hostname: registry
    networks:
      icegrid:
        ipv4_address: 172.29.0.10
    volumes:
      - "./registry.config:/etc/icegridregistry.conf:ro"
    healthcheck:
      test: "bash -c ':> /dev/tcp/127.0.0.1/4061'"
      interval: 1s

  node1:
    <<: *node
    hostname: node1
    networks:
      icegrid:
        ipv4_address: 172.29.0.11
    volumes:
      - "./node1.config:/etc/icegridnode.conf:ro"
      - "./ssh/id_ed25519.pub:/run/authorized_key.pub:ro"

  node2:
    <<: *node
    hostname: node2
    networks:
      icegrid:
        ipv4_address: 172.29.0.12
    volumes:
      - "./node2.config:/etc/icegridnode.conf:ro"
      - "./ssh/id_ed25519.pub:/run/authorized_key.pub:ro"

  loader:
    build: ../docker/ignode
    image: hello-ice/ignode
    pull_policy: never
    hostname: loader
    networks:
      - icegrid
    volumes:
      - "./app.xml:/app.xml:ro"
      - "./locator.config:/locator.config:ro"
    command:
      - "/bin/bash"
      - "-c"
      - |
        icegridadmin --Ice.Config=/locator.config -u_ -p_ -e "application add /app.xml" || \
        icegridadmin --Ice.Config=/locator.config -u_ -p_ -e "application update /app.xml"
    depends_on:
      registry:
        condition: service_healthy
      node1:
        condition: service_started
      node2:
        condition: service_started

networks:
  icegrid:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
          gateway: 172.29.0.1
