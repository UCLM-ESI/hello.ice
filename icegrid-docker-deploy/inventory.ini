# Each IceGrid node is a container with its own address (see compose.yml).
# Ansible logs into them by SSH as "ice", the user that runs icegridnode and
# its servers, with the key generated in the ssh directory. The host keys are
# not checked because they change whenever the image is rebuilt.

[nodes]
node1 ansible_host=172.29.0.11
node2 ansible_host=172.29.0.12

[nodes:vars]
ansible_user=ice
ansible_ssh_private_key_file={{ inventory_dir }}/ssh/id_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
